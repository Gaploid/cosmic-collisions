<script>
(function () {
'use strict';
var $ = CC.$, fail = CC.fail;
var boot = CC.boot();
if (!boot) return;
var canvas = boot.canvas, gl = boot.gl, floatBlend = boot.floatBlend;

// ---------- units ----------
// G = 1, Earth mass = 1, Earth radius = 1. Then the time unit is √(R³/GM) = 805 s
// (13.4 min), the velocity unit is 7.91 km/s, and escape speed off Earth is √2.
// Every body-particle carries the same mass, so a body's mass is a head count
// and — at Earth density — its radius is the cube root of its mass.
var T_UNIT = 805, V_UNIT = 7.91;
var E_KG = 6.256e7;                         // GM⊕/R⊕: the energy unit per kilogram, J/kg
var CP_ROCK = 1200, CP_IRON = 450;          // heat capacities, J/kg·K — molten silicate, liquid iron
var L_EM = 0.1163;                          // the Earth–Moon system's angular momentum today, 3.5e34 kg m²/s, in M⊕√(GM⊕R⊕)
// A lattice of touching spheres fills 74 % of the space; a pile poured at
// random jams at about 64 %, and the onion the bodies are built as jams a
// little looser than the lattice it replaces — left at the lattice's radius
// its particles would stand the body 4 % wide of the radius its mass asks
// for, and 4 % less bound. The grains are that much smaller instead.
var JAM = 0.96;
var N_CHOICES = CC.N_CHOICES, N_LABELS = CC.N_LABELS, SLOTS = CC.SLOTS;
var FL = 6.0, FH = 2 * FL / 64;             // gravity mesh: 64³ cells over ±6 R⊕
var PP_CAP = 8192, PP_W = 128, PP_H = 64;   // the loose material the pairwise pass can take, as a 128×64 list
var PP_CUT = 5 * FH;                        // how far the pairwise correction reaches: five cells
var PRESETS = {
  theia:   { q: 0.10, angle: 45, vfac: 1.05, dist: 7.5, label: 'theia' },      // the canonical Moon-forming impact
  headon:  { q: 0.10, angle: 0,  vfac: 1.00, dist: 7.5, label: 'head-on' },
  hitrun:  { q: 0.25, angle: 65, vfac: 1.60, dist: 10,  label: 'hit & run' },  // grazing and fast: the impactor survives
  twins:   { q: 1.00, angle: 45, vfac: 1.10, dist: 9,   label: 'twins' },
  shatter: { q: 0.50, angle: 20, vfac: 2.60, dist: 18,  label: 'shatter' }
};
// ---------- what the device is ----------
// src/shell.js works out what it is looking at; this page takes the numbers
// it draws by. DEV.compact is read where it is used: it changes with the
// window, and a copy taken here would be the shape the page opened at.
var DEV = CC.dev;
var PHONE = DEV.PHONE, TABLET = DEV.TABLET, DPR_CAP = DEV.DPR_CAP;
var BLUR_PASSES = DEV.BLUR_PASSES, ANALYZE_EVERY = DEV.ANALYZE_EVERY, DEFAULT_N = DEV.DEFAULT_N;

// both bodies arrive turning about the orbital axis, prograde, with days of
// about eight hours — a young planet's. It is a property of the rock, like its
// density, and it had a slider once; nobody needs to turn Earth's day down to
// nothing from the panel, so spin0 and spin1 live here (negative is retrograde,
// ±0.55 is the Ćuk & Stewart 2.6-hour Earth, and maclaurin() cuts the spheroid)
var S = { q: 0.1, angle: 45, vfac: 1.05, spin0: 0.18, spin1: 0.20, nIdx: DEFAULT_N, rest: 0.3, core: 0.325, dens: 0.75,
          exposure: 1.0, glow: 1.0, shade: true, stars: true, follow: false, speed: 4, preset: 'theia' };
var COL_TARGET = [0.40, 0.58, 0.90], COL_IMPACTOR = [0.96, 0.55, 0.28];
// the palette, by w = layer + 4·body: core, mantle, crust for the target, then
// the same three for the impactor — its core gold against Earth's silver
var PALETTE = [[0.86, 0.86, 0.82], [0.60, 0.22, 0.17], COL_TARGET, [0, 0, 0],
               [0.88, 0.72, 0.42], [0.58, 0.30, 0.14], COL_IMPACTOR, [0, 0, 0]];
// the look of the heat and the film, in src/shell.js so every scenario page
// wears the same one; __impact.look reaches this object
var LOOK = CC.look, FOV = CC.FOV, glowCol = CC.glowCol;

// ---------- shaders ----------
// They live in src/glsl-*.js and src/stars.js, where the other scenario pages
// share them; this page names the ones it draws with.
var SH = CC.glsl;
var QUAD_VS = SH.QUAD_VS, SLOT_VS = SH.SLOT_VS, SLOT_FS = SH.SLOT_FS;
var DEP_VS = SH.DEP_VS, DEP_FS = SH.DEP_FS, COARSE_FS = SH.COARSE_FS, MONO_FS = SH.MONO_FS, CELL_FS = SH.CELL_FS;
var SIM_FS = SH.simFS({ gravity: 'mesh' }), RIGID_FS = SH.RIGID_FS, PERM_FS = SH.PERM_FS, DIAG_FS = SH.DIAG_FS;
var PPGATHER_FS = SH.PPGATHER_FS, PPFORCE_FS = SH.PPFORCE_FS;
var STAR_CAT = SH.STAR_CAT, unb64 = SH.unb64, STAR_VS = SH.STAR_VS, STAR_FS = SH.STAR_FS;
var G_VS = SH.G_VS, G_FS = SH.G_FS, BLUR_FS = SH.BLUR_FS, SHADE_FS = SH.SHADE_FS;
var BRIGHT_FS = SH.BRIGHT_FS, BLOOM_FS = SH.BLOOM_FS, SUN_FS = SH.SUN_FS, TONE_FS = SH.TONE_FS, FXAA_FS = SH.FXAA_FS;
// ---------- GL helpers ----------
// In src/gl.js, where the other scenario pages take them from too.
var GLH = CC.gl;
GLH.init(boot);
var compile = GLH.compile, program = GLH.program, floatTex = GLH.floatTex;
var simTarget = GLH.simTarget, freeTarget = GLH.freeTarget, fboFor = GLH.fboFor;
var makeGrid = GLH.makeGrid, freeGrid = GLH.freeGrid;
var screenTarget = GLH.screenTarget, freeScreen = GLH.freeScreen, bloomTarget = GLH.bloomTarget;
var vao = GLH.vao, MAX_POINT = GLH.MAX_POINT;

var simProg, slotProg, depProg, coarseProg, monoProg, cellProg, rigidProg, diagProg, ppGatherProg, ppForceProg, permProg;
var starProg, gProg, blurProg, shadeProg, sunProg, brightProg, bloomProg, toneProg, fxaaProg, vao;
try {
  simProg = program(QUAD_VS, SIM_FS);
  slotProg = program(SLOT_VS, SLOT_FS);
  depProg = program(DEP_VS, DEP_FS);
  coarseProg = program(QUAD_VS, COARSE_FS);
  monoProg = program(QUAD_VS, MONO_FS);
  cellProg = program(QUAD_VS, CELL_FS);
  rigidProg = program(QUAD_VS, RIGID_FS);
  diagProg = program(QUAD_VS, DIAG_FS);
  ppGatherProg = program(QUAD_VS, PPGATHER_FS);
  ppForceProg = program(QUAD_VS, PPFORCE_FS);
  permProg = program(QUAD_VS, PERM_FS);
  starProg = program(STAR_VS, STAR_FS);
  gProg = program(G_VS, G_FS);
  blurProg = program(QUAD_VS, BLUR_FS);
  shadeProg = program(QUAD_VS, SHADE_FS);
  brightProg = program(QUAD_VS, BRIGHT_FS);
  bloomProg = program(QUAD_VS, BLOOM_FS);
  toneProg = program(QUAD_VS, TONE_FS);
  sunProg = program(QUAD_VS, SUN_FS);
  fxaaProg = program(QUAD_VS, FXAA_FS);
} catch (e) {
  return;
}
vao = gl.createVertexArray();
gl.bindVertexArray(vao);   // attribute-less drawing: every vertex is made from gl_VertexID
// the sky, from src/stars.js — the same catalogue on every scenario page
var sky = SH.starSetup(gl, starProg, vao);

// ---------- the picture ----------
// src/view.js owns the screen-sized targets, the camera and render(); it is
// handed the programs this page compiled and the sky it drew.
var VIEW = CC.view;
VIEW.init({ gl: gl, canvas: canvas, S: S, starVao: sky.vao, starCount: sky.count,
            pal: PALETTE,
            progs: { g: gProg, blur: blurProg, shade: shadeProg, sun: sunProg, bright: brightProg,
                     bloom: bloomProg, tone: toneProg, fxaa: fxaaProg, star: starProg } });
var render = VIEW.render, resize = VIEW.resize, governQuality = VIEW.governQuality, cam = VIEW.cam;

// ---------- the meshes ----------
var dummy = floatTex(1, 1, new Float32Array([-1, 0, 0, 0]));   // "no particle", for slot samplers not yet filled
var pm = {
  fine: floatTex(512, 513, null, floatBlend ? gl.RGBA32F : gl.RGBA16F, floatBlend ? gl.FLOAT : gl.HALF_FLOAT),   // 64³: Σ w·xyz, Σ w — blendable; a scratch row below
  coarse: floatTex(64, 64, null),                              // 16³
  mono: floatTex(1, 1, null),
  force: floatTex(512, 513, null)                              // acceleration and potential at every fine cell; the scratch row copied
};
pm.fineFbo = fboFor(pm.fine); pm.coarseFbo = fboFor(pm.coarse); pm.monoFbo = fboFor(pm.mono); pm.forceFbo = fboFor(pm.force);

// the loose material's pairwise pass: a seat per particle (-1 for none), the
// particle in each seat, the seats' positions gathered, the correction found
var pp = {
  index: floatTex(PP_W, PP_H, null, gl.R32F, gl.FLOAT, gl.RED),
  list: floatTex(PP_W, PP_H, null), force: floatTex(PP_W, PP_H, null),
  slot: null, slotArr: null, indexArr: new Float32Array(PP_CAP), count: 0, loose: 0
};
pp.listFbo = fboFor(pp.list); pp.forceFbo = fboFor(pp.force);

// the contact grid: G³ hashed cells × SLOTS textures of particle indices
var grid = null;


// ---------- math and bodies ----------
// Both live in src/, shared with the other scenario pages.
var MATH = CC.math, BODIES = CC.bodies;
var mulberry = MATH.mulberry, perspective = MATH.perspective, lookAt = MATH.lookAt, mul = MATH.mul;
var ball = BODIES.ball, relax = BODIES.relax, maclaurin = BODIES.maclaurin, turn = BODIES.turn;

// The mesh's own force between two particles by their distance, for the
// pairwise pass to subtract. The two are put on the grid (a random offset, a
// random direction) and the mesh's arithmetic is repeated here — cloud-in-cell
// deposit, force and potential at each node's centre of mass with the near
// softening, own node left out, cloud-in-cell gather — less what the first
// particle feels alone, its self-force. Averaged over 80 placings a bin, 64
// bins to the cut-off; returned as force × r² and potential × r, which go to
// 1 and −1 where the mesh is Newton's.
function meshPairTable(bins, cut) {
  var rng = mulberry(777), eps2 = 0.5 * FH * FH, per = 80;
  var f = new Float32Array(bins), pt = new Float32Array(bins);
  function corners(p) {
    var g = [(p[0] + FL) / FH - 0.5, (p[1] + FL) / FH - 0.5, (p[2] + FL) / FH - 0.5];
    var fl = [Math.floor(g[0]), Math.floor(g[1]), Math.floor(g[2])], t = [g[0] - fl[0], g[1] - fl[1], g[2] - fl[2]], out = [];
    for (var k = 0; k < 8; k++) {
      var ox = k & 1, oy = (k >> 1) & 1, oz = k >> 2;
      out.push([(fl[0] + ox) + ',' + (fl[1] + oy) + ',' + (fl[2] + oz), (ox ? t[0] : 1 - t[0]) * (oy ? t[1] : 1 - t[1]) * (oz ? t[2] : 1 - t[2])]);
    }
    return out;
  }
  function field(parts, at) {
    var nodes = new Map(), i, k;
    for (i = 0; i < parts.length; i++) {
      var p = parts[i], cs = corners(p);
      for (k = 0; k < 8; k++) {
        var n = nodes.get(cs[k][0]), w = cs[k][1];
        if (!n) { n = { m: 0, x: 0, y: 0, z: 0, fx: 0, fy: 0, fz: 0, pot: 0 }; nodes.set(cs[k][0], n); }
        n.m += w; n.x += w * p[0]; n.y += w * p[1]; n.z += w * p[2];
      }
    }
    var list = Array.from(nodes.values());
    list.forEach(function (n) { n.x /= n.m; n.y /= n.m; n.z /= n.m; });
    list.forEach(function (c) {
      list.forEach(function (o) {
        if (o === c) return;
        var rx = o.x - c.x, ry = o.y - c.y, rz = o.z - c.z, inv = 1 / Math.sqrt(rx * rx + ry * ry + rz * rz + eps2), inv3 = inv * inv * inv;
        c.fx += rx * o.m * inv3; c.fy += ry * o.m * inv3; c.fz += rz * o.m * inv3; c.pot -= o.m * inv;
      });
    });
    var out = [0, 0, 0, 0], cs = corners(at);
    for (k = 0; k < 8; k++) {
      var n = nodes.get(cs[k][0]), w = cs[k][1];
      if (!n) continue;
      out[0] += w * n.fx; out[1] += w * n.fy; out[2] += w * n.fz; out[3] += w * n.pot;
    }
    return out;
  }
  for (var b = 0; b < bins; b++) {
    var r = (b + 0.5) / bins * cut, sf = 0, sp = 0;
    for (var s = 0; s < per; s++) {
      var p = [(rng() - 0.5) * FH, (rng() - 0.5) * FH, (rng() - 0.5) * FH];
      var z = 2 * rng() - 1, ph = rng() * 6.2831853, rr = Math.sqrt(1 - z * z), u = [rr * Math.cos(ph), rr * Math.sin(ph), z];
      var q = [p[0] + u[0] * r, p[1] + u[1] * r, p[2] + u[2] * r];
      var both = field([[p[0], p[1], p[2], 1], [q[0], q[1], q[2], 1]], p), alone = field([[p[0], p[1], p[2], 1]], p);
      sf += (both[0] - alone[0]) * u[0] + (both[1] - alone[1]) * u[1] + (both[2] - alone[2]) * u[2];
      sp += both[3] - alone[3];
    }
    f[b] = sf / per * r * r; pt[b] = sp / per * r;
  }
  return { f: f, p: pt };
}
var PP_TAB = meshPairTable(64, PP_CUT);


var sim = null, posBuf = null, velBuf = null, gen = 0;
var report = null;
var stepAcc = 0, paused = false;

function build() {
  var N = N_CHOICES[S.nIdx];
  var W = N >= 131072 ? 512 : N >= 32768 ? 256 : 128, H = N / W;
  var q = S.q, dens = S.dens, coreF = S.core;
  var RHO_R = 2.5;                                     // core over mantle density: Earth's
  var coreV = coreF / (RHO_R - coreF * (RHO_R - 1));   // the core's share of the volume
  // every body-particle has the same radius and sits on the same lattice;
  // density is mass. Earth's volume is the unit, the impactor's follows from
  // its density, and the lattice spacing from the volume each particle gets.
  var V1 = 1, V2 = q / dens;
  var vp = (V1 + V2) / N;
  var s = Math.cbrt(16 * Math.PI * vp / 3);            // the FCC cell edge that gives that volume: the unit of spacing
  var a = JAM * s / (2 * Math.SQRT2);                  // body-particle radius: see JAM
  var n1 = Math.round(N * V1 / (V1 + V2)), n2 = N - n1;
  if (n2 < 16) { n2 = 16; n1 = N - n2; }
  var R1 = Math.cbrt(V1), R2 = Math.cbrt(V2), Rsum = R1 + R2;
  // spin: a fraction of breakup, √(M/R³) — 1 for Earth, √ρ for the impactor —
  // about the orbital axis, prograde when positive; each body is cut as the
  // Maclaurin spheroid for its rate, so it arrives already in equilibrium
  var w0 = [0, S.spin0, 0], w1 = [0, S.spin1 * Math.sqrt(dens), 0];
  var e1 = maclaurin(Math.abs(S.spin0)), e2 = maclaurin(Math.abs(S.spin1));
  var Re1 = R1 / Math.pow(1 - e1 * e1, 1 / 6), Re2 = R2 / Math.pow(1 - e2 * e2, 1 / 6);   // equatorial radii

  // layers by shell — the onion comes out sorted inside-out: the innermost
  // shells nearest coreV of the volume are core, the outer shell crust, the
  // rest mantle. Mass is relative to an Earth-mantle particle: core ×2.5,
  // the impactor's ×its density.
  var rng = mulberry(1234567);
  var b1 = ball(n1, s, a, rng, e1), b2 = ball(n2, s, a, rng, e2);
  var pos = new Float32Array(N * 4), vel = new Float32Array(N * 4);

    var nCore = bounds.reduce(function (best, c) { return Math.abs(c - coreV * n) < Math.abs(best - coreV * n) ? c : best; }, 0);
    var nCrust = n - bounds[bounds.length - 2];
    var sum = 0;
    for (var j = 0; j < n; j++) {
      var layer = j < nCore ? 0 : j >= n - nCrust ? 2 : 1;

  var sum1 = layers(0, n1, b1.bounds, 1), sum2 = layers(n1, n2, b2.bounds, dens);
  var mref = 1 / sum1;                                 // an Earth-mantle particle: Earth weighs 1
  var M1 = 1, M2 = mref * sum2, M = M1 + M2;

  // the start line with energy and angular momentum; from there the two-body
  // problem is integrated exactly while the bodies fly in rigid

  var bD = Math.min(bc * vc / vD, D * 0.95);

  var c2 = [xD + c1[0], 0, bD + c1[2]];

  var bulk0 = [0, 0, 0], bulk1 = [0, 0, 0];
  var i, o;
  for (i = 0; i < n1; i++) { o = i * 4; pos[o] = b1[i * 3] + c1[0]; pos[o + 1] = b1[i * 3 + 1] + c1[1]; pos[o + 2] = b1[i * 3 + 2] + c1[2]; pos[o + 3] = lay[i]; }

    creep: 0.12, R1: R1, R2: R2, Re1: Re1, Re2: Re2, M1: M1, M2: M2, M: M, rel: rel, bulk0: bulk0, bulk1: bulk1, vc: vc, vesc: vesc,
    spin0: w0, spin1: w1, cen0: c1, cen1: c2,

    diag: floatTex(W, H, null), ref: null,

    // conduction, which would do nothing in hours across 200 km of rock, but
    // the mixing the impact does below the particle size: it evens out what

  $('hud-report').hidden = true; lastReport = '';

// Uniforms that hold for the whole run are set once here; the passes below

  gl.uniform1i(u.uPos, 0);

  gl.uniform2i(u.uSize, sim.W, sim.H);
  gl.uniform1f(u.uInvCell, 1 / sim.cell);
  gl.uniform1i(u.uGMask, g.G - 1); gl.uniform1i(u.uGShift, g.GShift);
  gl.uniform1i(u.uSXMask, g.SX - 1); gl.uniform1i(u.uSXShift, g.SXShift);

  gl.uniform1i(u.uPos, 0); gl.uniform1i(u.uMat, 1); gl.uniform1i(u.uMono, 2);

  gl.uniform1f(u.uGm, sim.m);

// 1. contact cells, one slot per pass
function passSlots() {
  var g = grid, s, k;
  gl.useProgram(slotProg.p);
  gl.viewport(0, 0, g.AW, g.AH);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS); gl.depthMask(true); gl.disable(gl.BLEND);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
  gl.clearColor(-1, 0, 0, 0);
  for (k = 0; k < SLOTS; k++) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, g.fbo[k]);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    for (s = 0; s < SLOTS; s++) { gl.activeTexture(gl.TEXTURE1 + s); gl.bindTexture(gl.TEXTURE_2D, s < k ? g.slot[s] : dummy); }
    gl.uniform1i(slotProg.u.uK, k);
    gl.drawArrays(gl.POINTS, 0, sim.N);
  }
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
}

// 2. mass onto the mesh
function passDeposit() {
  gl.useProgram(depProg.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pm.fineFbo);
  gl.viewport(0, 0, 512, 513);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sim.mat);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, pm.mono);
  gl.drawArrays(gl.POINTS, 0, sim.N * 8);
  gl.disable(gl.BLEND);
}

// 3. the coarse mesh, 4. its total
function passCoarse() {
  gl.useProgram(coarseProg.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pm.coarseFbo);
  gl.viewport(0, 0, 64, 64);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pm.fine);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(monoProg.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pm.monoFbo);
  gl.viewport(0, 0, 1, 1);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pm.coarse);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// 5. gravity at every occupied cell
function passCell() {
  gl.useProgram(cellProg.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pm.forceFbo);
  gl.viewport(0, 0, 512, 513);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pm.fine);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, pm.coarse);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// 6. the particles: read src, write dst, swap
function passSim(settle, kick, gdt) {
  var g = grid, u = simProg.u, s;
  gl.useProgram(simProg.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sim.dst.fbo);
  gl.viewport(0, 0, sim.W, sim.H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sim.src.vel);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, pm.force);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, pm.mono);
  for (s = 0; s < SLOTS; s++) { gl.activeTexture(gl.TEXTURE4 + s); gl.bindTexture(gl.TEXTURE_2D, g.slot[s]); }
  gl.activeTexture(gl.TEXTURE12); gl.bindTexture(gl.TEXTURE_2D, sim.mat);
  gl.activeTexture(gl.TEXTURE13); gl.bindTexture(gl.TEXTURE_2D, sim.src.q);
  gl.activeTexture(gl.TEXTURE14); gl.bindTexture(gl.TEXTURE_2D, pp.slot);
  gl.activeTexture(gl.TEXTURE15); gl.bindTexture(gl.TEXTURE_2D, pp.force);
  gl.uniform1f(u.uSettle, settle ? 1 : 0);
  gl.uniform1f(u.uKick, kick ? 1 : 0);
  gl.uniform1f(u.uGDt, gdt);
  gl.uniform3fv(u.uBulk0, sim.bulk0);
  gl.uniform3fv(u.uBulk1, sim.bulk1);
  gl.uniform3fv(u.uCen0, sim.cen0);
  gl.uniform3fv(u.uCen1, sim.cen1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

// the read-outs for the books, from cells and a mesh built for the positions
// as they are right now — so the seat check is exact and the potential current
function passDiag() {
  var g = grid, s;
  passSlots();
  passDeposit(); passCoarse(); passCell(); passPP();
  gl.useProgram(diagProg.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, sim.diagFbo);
  gl.viewport(0, 0, sim.W, sim.H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sim.src.q);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, pm.force);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, pm.mono);
  for (s = 0; s < SLOTS; s++) { gl.activeTexture(gl.TEXTURE4 + s); gl.bindTexture(gl.TEXTURE_2D, g.slot[s]); }
  gl.activeTexture(gl.TEXTURE12); gl.bindTexture(gl.TEXTURE_2D, pp.slot);
  gl.activeTexture(gl.TEXTURE13); gl.bindTexture(gl.TEXTURE_2D, pp.force);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// 7. the loose material, pairwise: the list's positions gathered, then every
//    seat against the whole list
function passPP() {
  if (!pp.count) return;
  gl.useProgram(ppGatherProg.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pp.listFbo);
  gl.viewport(0, 0, PP_W, PP_H);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sim.mat);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, pp.index);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.useProgram(ppForceProg.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pp.forceFbo);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, pp.list);
  gl.uniform1i(ppForceProg.u.uCount, pp.count);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// One step. The contact cells are rebuilt every other step — a particle moves
// under 0.2 radii a step and the search radius has 0.6 to spare — and the
// gravity mesh every eighth: gravity changes on the scale of a time unit, a
// step is a thousandth of one. The mesh's pull is given all at once, on the
// step it is measured, as the impulse for the steps it stands for: used where
// it was measured it is time-symmetric, whereas held for four steps it lags —
// and a turning body feeling its own field a little behind it is braked by it
// like by a tide (0.4 % of the angular momentum in six time units).
var MESH_EVERY = 8;
// The spring was sized for the impact speed. An hour and a half past first
// touch the splash is over and relative speeds are a fraction of it, so the
// spring is let go to half its stiffness — the dashpot with it, so bounces
// stay the same — and the step, set by the spring's period, grows by √2. A
// body at rest overlaps 2 % of a radius instead of 1; a re-impact at a
// third of the impact speed overlaps what the impact did.
function soften() {
  sim.soft = true;
  sim.k *= 0.5; sim.c *= Math.SQRT1_2; sim.dt *= Math.SQRT2;
  sim.damp = Math.exp(-sim.dt * 12);
  setStaticUniforms();
}
function step(settle, kick) {
  if (!settle && !kick && !sim.soft && sim.t - sim.impactT > 1.5) soften();
  var n = sim.stepNo++;
  if (n % 2 === 0) passSlots();
  var mesh = n % MESH_EVERY === 0;
  if (mesh) { passDeposit(); passCoarse(); passCell(); passPP(); }
  passSim(settle, kick, mesh ? MESH_EVERY * sim.dt : 0);
}

// settling: n damped steps; when done, the approach begins
function settleSome(n) {
  n = Math.min(n, sim.settleLeft);
  for (var i = 0; i < n; i++) step(true, false);
  sim.settleLeft -= n;
  if (sim.settleLeft === 0) { sim.phase = 'approach'; analyzedAt = sim.stepNo; }   // the settle's steps are not the analysis's to count
}

// the approach: the two-body problem, leapfrog on the CPU, the bodies carried
// rigid on the GPU by the frame's mean velocities, each turned by its spin;
// at first touch, the kick
function centres(r) {
  var M = sim.M, M1 = sim.M1, M2 = sim.M2;
  return [[-r[0] * M2 / M, -r[1] * M2 / M, -r[2] * M2 / M], [r[0] * M1 / M, r[1] * M1 / M, r[2] * M1 / M]];
}
function rigidStep(dtF) {

  var r0 = [r[0], r[1], r[2]], n = 8, h = dtF / n, i, cen = centres(r0);

    r[0] += v[0] * h; r[1] += v[1] * h; r[2] += v[2] * h;

  gl.bindFramebuffer(gl.FRAMEBUFFER, sim.dst.fbo);
  gl.viewport(0, 0, sim.W, sim.H);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sim.src.pos);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sim.src.vel);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, sim.src.aux);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, sim.src.q);
  gl.uniform3fv(u.uBulk0, sim.bulk0);
  gl.uniform3fv(u.uBulk1, sim.bulk1);
  gl.uniform3fv(u.uCen0, cen[0]);
  gl.uniform3fv(u.uCen1, cen[1]);
  gl.uniformMatrix3fv(u.uRot0, false, turn(sim.spin0, dtF));
  gl.uniformMatrix3fv(u.uRot1, false, turn(sim.spin1, dtF));
  gl.uniform1f(u.uDt, dtF);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  var R = sim.matR.slice();
  worker.postMessage({ gen: sim.gen, N: sim.N, m: sim.m, a: sim.a, P: p.P, V: p.V, R: R, D: p.D, k: sim.k, touch: 2 * sim.a, cap: PP_CAP, sort: p.sort, t: p.t }, [p.P.buffer, p.V.buffer, R.buffer, p.D.buffer]);
}



// ---------- HUD ----------
function fmtMass(x) { return x.toFixed(3) + ' M⊕'; }
function fmtTime(t) {
  var sec = t * T_UNIT, hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60);
  return 'T+ ' + hh + 'h ' + (mm < 10 ? '0' : '') + mm + 'm';
}
function fmtCount(n) { return n >= 1e6 ? (n / 1e6).toFixed(n % 1e6 ? 1 : 0) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n); }
// The report is rebuilt sixty times a second and changes perhaps twice a
// second: parsing the HTML only when it differs saves the phone that work, and
// hands the panel the one moment it needs — the box below it changed height.
var lastReport = '';
function showReport(rep, rows) {
  var html = '';
  for (var i = 0; i < rows.length; i++)
    html += '<b>' + rows[i][0] + '</b><span class="v">' + rows[i][1] + '</span><i>' + (rows[i][2] || '') + '</i>';
  if (html === lastReport && !rep.hidden) return;
  lastReport = html;
  rep.innerHTML = html;
  rep.hidden = false;
  fitPanel();
}
var fpsFrames = 0, fpsT0 = performance.now(), fps = 0;
function hud() {
  var sub = PRESETS[S.preset] ? PRESETS[S.preset].label : 'custom';
  if (!sim) sub += ' · building';
  else if (sim.phase === 'settle') sub += ' · settling ' + Math.round(100 * (1 - sim.settleLeft / sim.settleTotal)) + '%';
  else if (paused) sub += ' · paused';
  else if (sim.phase === 'approach') sub += ' · approach';
  else if (sim.t - sim.impactT < 2.5) sub += ' · impact';
  else sub += ' · aftermath';
  $('hud-sub').textContent = sub;
  $('hud-clock').textContent = sim ? fmtTime(sim.t) : 'T+ 0h 00m';
  $('hud-fps').textContent = sim ? fmtCount(sim.N) + (DEV.compact ? '' : ' bodies') + ' · ' + Math.round(sim.vc * V_UNIT) + ' km/s · ' + fps + ' fps' : '';
  var rep = $('hud-report');
  if (report && sim) {
    var pct = function (x) { return Math.round(x * 100) + '%'; };
    var dash = '\u2014', sec = report.second;
    if (DEV.compact) {
      // A phone gets the outcome, not the audit: what the planet came out as,
      // what the disk it is wearing would make, what left for good. The
      // impactor's share of every piece and the books belong to the wide
      // screen that has the room to argue.
      showReport(rep, [
        ['largest', fmtMass(report.largest), pct(report.largestIron) + ' iron' + (report.day < 200 ? ' \u00b7 day ' + report.day.toFixed(1) + ' h' : '')],
        ['orbit', fmtMass(report.orbit), '\u2192 moon ' + (report.moon / 0.0123).toFixed(2) + ' M\u263e'],
        ['escaping', fmtMass(report.escape), ''],
        ['2nd body', sec ? fmtMass(sec.mass) : dash, sec ? sec.dist.toFixed(1) + ' R\u2295 \u00b7 ' + (sec.bound ? 'bound' : 'unbound') : '']
      ]);
      return;
    }
    // the books, against the first look: the angular momentum in today's
    // Earth–Moon units and its change, the barycentre's drift, the mechanical
    // energy, the heat, and whether the two add up to what they were
    var ref = sim.ref, E = report.KE + report.PE + report.EL;
    var sgn = function (x, d) { var s = Math.abs(x).toFixed(d); return (parseFloat(s) === 0 ? '' : x < 0 ? '\u2212' : '+') + s; };
    showReport(rep, [
      ['largest', fmtMass(report.largest), pct(report.largestIron) + ' iron \u00b7 ' + pct(report.largestImp) + ' impactor' + (report.day < 200 ? ' \u00b7 day ' + report.day.toFixed(1) + ' h' : '')],
      ['in orbit', fmtMass(report.orbit), report.orbit > 0.0005 ? 'j ' + report.jD.toFixed(2) : ''],
      ['moon', (report.moon / 0.0123).toFixed(2) + ' M\u263e', ''],
      ['escaping', fmtMass(report.escape), ''],
      ['2nd body', sec ? fmtMass(sec.mass) : dash, sec ? sec.dist.toFixed(1) + ' R\u2295 \u00b7 ' + (sec.bound ? 'bound' : 'unbound') + ' \u00b7 ' + pct(sec.imp) + ' impactor' : ''],
      ['L', (report.L / L_EM).toFixed(2) + ' LEM', (ref ? sgn((report.L - ref.L) / ref.L * 100, 2) + ' % \u00b7 ' : '') + 'drift ' + (report.drift * V_UNIT * 1000).toFixed(1) + ' m/s'],
      ['energy', sgn(E, 3), 'heat ' + report.Q.toFixed(3) + ' \u2248 ' + Math.round(report.Q / report.M * E_KG / CP_ROCK / 100) * 100 + ' K' + (ref ? ' \u00b7 balance ' + sgn((E + report.Q - ref.EQ) / Math.abs(ref.E) * 100, 2) + ' %' : '')],
      ['cells', (report.unseated * 100).toFixed(2) + ' %', 'unseated \u00b7 ' + (report.full * 100).toFixed(1) + ' % full \u00b7 pairs ' + fmtCount(report.pp.list.length) + (report.pp.loose > report.pp.list.length ? ' of ' + fmtCount(report.pp.loose) : '')]
    ]);
  }
}

// ---------- the loop ----------
var frameNo = 0;
function frame() {
  if (CC.run.lost) return;
  requestAnimationFrame(frame);
  resize();
  if (sim) {
    if (sim.phase === 'settle') settleSome(Math.max(2, Math.round(65536 / sim.N * 16)));   // twice the steps a frame: the settle is twice as long as it was, and it is the first thing anyone sees
    else if (!paused) {
      if (sim.phase === 'approach') rigidStep(0.0025 * S.speed);
      else {
        stepAcc += S.speed;
        var guard = 0;
        while (stepAcc >= 1 && guard++ < 32 && sim.phase === 'full') { step(false, false); sim.t += sim.dt; stepAcc -= 1; }
      }
    }
  }
  render();
  if (pending) collect();
  if (sim && sim.phase !== 'settle' && (frameNo % ANALYZE_EVERY === 0 || sim.stepNo - analyzedAt >= 360)) analyze();
  frameNo++;
  fpsFrames++;
  var now = performance.now();
  if (now - fpsT0 > 500) { fps = Math.round(fpsFrames * 1000 / (now - fpsT0)); fpsFrames = 0; fpsT0 = now; }
  governQuality(now, fps);
  hud();
}

// ---------- controls ----------
function setOn(container, attr, value) {
  container.querySelectorAll('button[' + attr + ']').forEach(function (b) { b.classList.toggle('on', b.getAttribute(attr) === String(value)); });
}
function syncSliders() {
  $('set-q').value = S.q; $('val-q').textContent = S.q.toFixed(2);
  $('set-angle').value = S.angle; $('val-angle').textContent = S.angle;
  $('set-vfac').value = S.vfac; $('val-vfac').textContent = S.vfac.toFixed(2);
  $('set-n').value = S.nIdx; $('val-n').textContent = N_LABELS[S.nIdx];
  $('set-rest').value = S.rest; $('val-rest').textContent = S.rest.toFixed(2);
  $('set-core').value = Math.round(S.core * 100); $('val-core').textContent = Math.round(S.core * 100);
  $('set-dens').value = S.dens; $('val-dens').textContent = S.dens.toFixed(2);
  $('set-exp').value = S.exposure; $('val-exp').textContent = S.exposure.toFixed(1);
  $('set-glow').value = S.glow; $('val-glow').textContent = S.glow.toFixed(1);
  $('val-shade').textContent = S.shade ? 'on' : 'off';
  $('val-stars').textContent = S.stars ? 'on' : 'off';
}
$('hud-preset').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-preset]');
  if (!b) return;
  var p = PRESETS[b.getAttribute('data-preset')];
  S.preset = b.getAttribute('data-preset'); S.q = p.q; S.angle = p.angle; S.vfac = p.vfac;
  cam.dist = p.dist;
  setOn($('hud-preset'), 'data-preset', S.preset);
  syncSliders();
  build();
});
$('hud-run').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.id === 'btn-pause') togglePause();
  else if (b.id === 'btn-restart') build();
  else if (b.hasAttribute('data-speed')) { S.speed = parseFloat(b.getAttribute('data-speed')); setOn($('hud-run'), 'data-speed', S.speed); }
});
function togglePause() {
  paused = !paused;
  var b = $('btn-pause');
  b.classList.toggle('paused', paused);
  b.setAttribute('aria-label', paused ? 'resume' : 'pause');
  b.setAttribute('title', (paused ? 'resume' : 'pause') + ' — space');
}
// The panel is the tallest thing on the page, and a phone on its side has 390
// points of height to give it. It gets whatever is left below wherever it
// starts — which is where the preset and run rows happen to have wrapped to —
// and scrolls inside that. Off a phone there is always room and the cap comes
// straight back off.
function fitPanel() {
  var p = $('adv-panel');
  p.style.maxHeight = '';
  if (p.hidden) return;
  var top = p.getBoundingClientRect().top;
  var floor = window.visualViewport ? visualViewport.height : window.innerHeight;
  if (DEV.compact) {
    // the clock runs the width of the foot, so the panel stops above it; and
    // upright the report is a band across the foot too, where on its side it
    // sits in the other column and is none of the panel's business
    var st = $('hud-stat').getBoundingClientRect();
    if (st.height) floor = Math.min(floor, st.top);
    var r = $('hud-report');
    if (!r.hidden && window.innerWidth <= 640) floor = Math.min(floor, r.getBoundingClientRect().top);
  }
  var room = floor - top - 10;
  if (room < p.scrollHeight) p.style.maxHeight = Math.max(120, room) + 'px';
}
$('adv-toggle').addEventListener('click', function () {
  var p = $('adv-panel'); p.hidden = !p.hidden; $('adv-toggle').classList.toggle('on', !p.hidden);
  fitPanel();
});
window.addEventListener('resize', fitPanel);
window.addEventListener('orientationchange', function () { setTimeout(fitPanel, 250); });
function custom() { S.preset = 'custom'; setOn($('hud-preset'), 'data-preset', ''); }
function onRange(id, live, apply, keepPreset) {
  var el = $(id);
  el.addEventListener('input', function () { apply(parseFloat(el.value)); syncSliders(); if (live) live(); });
  if (!live) el.addEventListener('change', function () { if (!keepPreset) custom(); build(); });
}
onRange('set-q', null, function (v) { S.q = v; });
onRange('set-angle', null, function (v) { S.angle = v; });
onRange('set-vfac', null, function (v) { S.vfac = v; });
onRange('set-n', null, function (v) { S.nIdx = v | 0; }, true);
onRange('set-rest', null, function (v) { S.rest = v; }, true);
onRange('set-core', null, function (v) { S.core = v / 100; }, true);
onRange('set-dens', null, function (v) { S.dens = v; }, true);
onRange('set-exp', function () {}, function (v) { S.exposure = v; });
onRange('set-glow', function () {}, function (v) { S.glow = v; });
$('set-shade').addEventListener('change', function () { S.shade = $('set-shade').checked; syncSliders(); });
$('set-stars').addEventListener('change', function () { S.stars = $('set-stars').checked; syncSliders(); });
window.addEventListener('keydown', function (e) {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
  if (e.code === 'Space') { e.preventDefault(); if (sim && sim.phase !== 'settle') togglePause(); }
  else if (e.code === 'KeyR') build();
  else if (e.code === 'KeyF') S.follow = !S.follow;   // the camera rides the planet; the key is the whole of it
});

// for scripted screenshots: run straight to a sim time (in time units) and hold
window.__impact = {
  get sim() { return sim; },
  get report() { return report; },
  set meshEvery(n) { MESH_EVERY = n; },
  set asyncRead(v) { asyncRead = !!v; },
  get state() { return { analyzing: analyzing, pending: !!pending, worker: !!worker, analyses: analyses, analyzedAt: analyzedAt, stepNo: sim && sim.stepNo, waitStatus: pending ? gl.clientWaitSync(pending.sync, 0, 0) : null }; },
  sortNow: function () { analyses = 0; analyze(true); return report; },
  get look() { return LOOK; },
  get cam() { return cam; },
  get lights() { return VIEW.lights; },
  temps: function () {
    var fbo = gl.createFramebuffer(), buf = new Float32Array(sim.W * sim.H * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, sim.src.vel, 0);
    gl.readPixels(0, 0, sim.W, sim.H, gl.RGBA, gl.FLOAT, buf);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fbo);
    var T = new Float32Array(sim.N);
    for (var i = 0; i < sim.N; i++) T[i] = buf[i * 4 + 3];
    T.sort();
    var at = function (p) { return Math.round(T[Math.floor(p * (sim.N - 1))]); };
    var out = { min: at(0), p10: at(0.1), p50: at(0.5), p90: at(0.9), p95: at(0.95), p99: at(0.99), max: at(1) };
    [2000, 5000, 10000, 20000].forEach(function (k) { var n = 0; for (var i = 0; i < sim.N; i++) if (T[i] > k) n++; out['above' + k] = +(n / sim.N).toFixed(3); });
    return out;
  },
  // the mesh's own books: the net force and torque its cells exert on each
  // other, which should be nothing — as fractions of the sum of their sizes
  meshCheck: function () {
    passDeposit(); passCoarse(); passCell();
    var F = new Float32Array(512 * 512 * 4), Mm = new Float32Array(512 * 512 * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pm.forceFbo); gl.readPixels(0, 0, 512, 512, gl.RGBA, gl.FLOAT, F);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pm.fineFbo); gl.readPixels(0, 0, 512, 512, gl.RGBA, gl.FLOAT, Mm);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    var fx = 0, fy = 0, fz = 0, af = 0, tx = 0, ty = 0, tz = 0, at = 0, M = 0, cells = 0;
    for (var i = 0; i < 512 * 512; i++) {
      var m = Mm[i * 4 + 3];
      if (m <= 0) continue;
      var w = m * sim.m, cx = Mm[i * 4] / m, cy = Mm[i * 4 + 1] / m, cz = Mm[i * 4 + 2] / m;
      var Fx = w * F[i * 4], Fy = w * F[i * 4 + 1], Fz = w * F[i * 4 + 2], Fm = Math.hypot(Fx, Fy, Fz);
      fx += Fx; fy += Fy; fz += Fz; af += Fm;
      tx += cy * Fz - cz * Fy; ty += cz * Fx - cx * Fz; tz += cx * Fy - cy * Fx; at += Fm * Math.hypot(cx, cy, cz);
      M += w; cells++;
    }
    var f = Math.hypot(fx, fy, fz), t = Math.hypot(tx, ty, tz);
    var sc = new Float32Array(4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, pm.forceFbo); gl.readPixels(0, 512, 1, 1, gl.RGBA, gl.FLOAT, sc);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return { cells: cells, mass: M, force: f, forceFrac: f / af, accelMs2: f / M * 7910 / 805, torque: t, torqueFrac: t / at, torqueLEMperUnit: t / L_EM,
             beyond: { mass: sc[3] * sim.m, reactMs2: Math.hypot(sc[0], sc[1], sc[2]) * sim.m * 7910 / 805 } };
  },
  // GPU time per pass, averaged over reps, via timer queries (Chrome desktop)
  profile: function (reps) {
    var ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
    if (!ext) return Promise.resolve('no timer queries');
    reps = reps || 20;
    var stars = S.stars;
    var items = [
      ['slots', passSlots], ['deposit', passDeposit], ['coarse+mono', passCoarse], ['cell', passCell], ['pp', passPP],
      ['sim', function () { passSim(false, false, 0); }], ['step', function () { step(false, false); }],
      ['render', render],
      ['render, no stars', function () { S.stars = false; render(); S.stars = stars; }]
    ];
    var qs = items.map(function () { return gl.createQuery(); });
    items.forEach(function (it, i) { gl.beginQuery(ext.TIME_ELAPSED_EXT, qs[i]); for (var r = 0; r < reps; r++) it[1](); gl.endQuery(ext.TIME_ELAPSED_EXT); });
    return new Promise(function (resolve) {
      (function poll() {
        if (gl.getParameter(ext.GPU_DISJOINT_EXT)) { resolve('disjoint, retry'); return; }
        if (!qs.every(function (q) { return gl.getQueryParameter(q, gl.QUERY_RESULT_AVAILABLE); })) { setTimeout(poll, 50); return; }
        var out = {};
        qs.forEach(function (q, i) { out[items[i][0]] = +(gl.getQueryParameter(q, gl.QUERY_RESULT) / 1e6 / reps).toFixed(3); });
        resolve(out);
      })();
    });
  },
  runTo: function (t) {
    if (sim.t > t) build();
    while (sim.phase === 'settle') settleSome(64);
    while (sim.phase === 'approach' && sim.t < t) rigidStep(0.01);
    while (sim.phase === 'full' && sim.t < t) { step(false, false); sim.t += sim.dt; if (sim.stepNo - analyzedAt >= 360) analyze(true); }
    analyze(true);
    paused = true; $('btn-pause').classList.add('paused');
    return sim.t;
  }
};

syncSliders();
resize();
build();
requestAnimationFrame(frame);
})();
</script>
</body>
